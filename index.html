<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFF8F0" />
  <title>Casper &amp; Arlo Care — use the app</title>
  <style>
    :root {
      --bg: #fff8f0;
      --surface: #ffffff;
      --border: #f5dce4;
      --ink: #4a3b3b;
      --muted: #6f5a5b;
      --rose: #e8a0b8;
      --rose-deep: #a84d6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--bg);
    }
    main {
      width: min(440px, 100%);
      padding: 8px 0 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 14px;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
    }
    a {
      color: var(--rose-deep);
    }
    .eyebrow {
      margin: 0 0 10px;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .btn.primary {
      background: var(--rose-deep);
      border-color: var(--rose-deep);
      color: #fff;
    }
    .btn.secondary {
      background: var(--surface);
      color: var(--ink);
    }
    .note {
      margin-top: 16px;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Care log</p>
    <h1>Casper &amp; Arlo</h1>
    <p>
      The old static dashboard is retired. Use the Care app for daily logging,
      digests, and both pets.
    </p>
    <div class="actions">
      <a class="btn primary" href="http://localhost:5173/">Open Care app (local)</a>
      <a class="btn secondary" href="archive/legacy-dashboard.html">Archive — export old localStorage</a>
    </div>
    <p class="note">
      Production: open your deployed web URL. Archive path:
      <code>archive/legacy-dashboard.html</code>
    </p>
  </main>
</body>
</html>
